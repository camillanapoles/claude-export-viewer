[project]
name = "claude-export-viewer"
version = "0.1.0"
description = "Convert Claude.ai data exports into browsable static HTML"
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1",
    "mistune>=3.0",
    "pydantic>=2.0",
    "pygments>=2.17",
]

[project.scripts]
claude-export-viewer = "claude_export_viewer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
